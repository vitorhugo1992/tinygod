<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyGod: rule maps, mock-up</title>
<style>
  :root { --bg: #0b1220; --card: #111a2c; --line: #24324d; --ink: #dfe7f5; --dim: #8796b3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { width: 100%; max-width: 520px; margin: 0 auto; padding: 14px 12px 40px; }
  h1 { font-size: 18px; margin: 4px 0 2px; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 12px; }
  .switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .switch button { background: none; border: 0; color: var(--dim); padding: 7px 16px; font: inherit; cursor: pointer; }
  .switch button.on { background: #1d2a44; color: var(--ink); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .card .hd { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-weight: 600;
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 28%, transparent), transparent 70%); }
  .card .hd i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); display: inline-block; }
  .card .hd .pill { margin-left: auto; font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; color: var(--dim); }
  .body { padding: 8px 12px 12px; }
  .sent { margin: 0 0 8px; font-size: 16px; line-height: 1.7; }
  .cv, .xl { min-width: 0; }
  .sent .w { border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .sent .s { color: #ffe08a; }
  .q { font: 600 13px system-ui; margin: 6px 0 4px; }
  .map { display: grid; grid-template-columns: 44px 1fr; grid-template-rows: 18px auto 15px; gap: 0; }
  .xl { grid-column: 2; position: relative; height: 18px; font-size: 11px; color: var(--dim); }
  .xl span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .xl span::after { content: ""; position: absolute; left: 50%; bottom: -3px; height: 4px; border-left: 1px solid #8796b380; }
  .xl span:first-child::after { left: 0; } .xl span:last-child::after { left: auto; right: 0; }
  .xd { grid-column: 2; grid-row: 3; position: relative; font-size: 10px; color: #8796b3b0; font-style: italic; }
  .xd span { position: absolute; transform: translateX(-50%); top: 1px; }
  .yl { grid-row: 2; position: relative; font-size: 11px; color: var(--dim); }
  .yl span { position: absolute; right: 6px; transform: translateY(-50%); white-space: nowrap; }
  .cv { grid-row: 2; position: relative; }
  .cv canvas { width: 100%; height: 120px; display: block; border-radius: 4px; }
  .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff6b0; border: 2px solid #111;
    transform: translate(-50%, -50%); box-shadow: 0 0 0 2px #fff6b088; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin: 7px 0 2px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 16px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid #ffffff30; }
  .cap { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .always { color: var(--dim); font-size: 13px; background: #0d1626;
    border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
  /* before */
  .old .mh { display: flex; justify-content: space-between; font: 11px ui-monospace, monospace; color: var(--dim); letter-spacing: .03em; margin: 4px 0 3px; }
  .old .mbox { position: relative; }
  .old canvas { width: 100%; height: 70px; display: block; border-radius: 4px; }
  .old .ml { position: absolute; left: 4px; font: 10px ui-monospace, monospace; color: #ffffffaa; }
  .old .mx { position: absolute; bottom: 2px; font: 10px ui-monospace, monospace; color: #ffffffaa; transform: translateX(-50%); }
  .note { color: var(--dim); font-size: 13px; border-left: 3px solid #3b5a8c; padding: 4px 10px; margin: 18px 0 0; }
  .note b { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Rule maps: when does each part act?</h1>
  <p class="sub">A mock-up with pretend readings (eyespot facing up, the cell at 10:00, 950 µm). Switch to compare.</p>
  <div class="switch"><button data-v="after" class="on">New</button><button data-v="before">Before</button></div>
  <div id="cards"></div>
  <p class="note" id="note"></p>
</main>
<script>
// one day in the tank: the sun from 06 to 18, light fading with depth to 5% at the floor (as in the game)
const TH = 2000, ATT = 0.0015, W = 240, H = 80, NOW = { h: 10, d: 950 };
const sun = (h) => Math.max(0, Math.sin(2 * Math.PI * (h - 6) / 24));
const light = (h, d) => sun(h) * Math.exp(-ATT * d);

// the water drawn as it is: black at night, deep blue far down, bright teal near the surface at noon
function water(L) {
  const t = Math.pow(Math.min(1, L), 0.45);
  return [8 + t * (70 - 8), 13 + t * (150 - 13), 26 + t * (170 - 26)];
}

const CARDS = [
  { name: 'Tail (front)', c: '#ff8a65', pill: 'RUNNING', verb: 'runs',
    sent: 'Runs when <span class="w"><i class="d" style="color:#ff5fa2">●</i> Eyespot (front)</span> sees <span class="w s">less than 25% sun</span> (dim).',
    q: 'When does the tail beat?',
    act: (L) => (L < 0.25 ? 'on' : null),
    keys: [['on', 'beats'], ['off', 'still']] },
  { name: 'Buoyancy chamber', c: '#cdeeff', pill: 'FLOAT', verb: 'floats',
    sent: 'Floats when <span class="w"><i style="color:#ff5fa2">●</i> Eyespot (front)</span> sees <span class="w s">less than 25% sun</span>, sinks when it sees <span class="w s">more than 50%</span>.',
    q: 'When does it float, when does it sink?',
    act: (L) => (L > 0.5 ? 'sink' : L < 0.25 ? 'float' : null),
    keys: [['float', 'floats'], ['sink', 'sinks'], ['off', 'neutral']] },
  { name: 'Nucleus (back)', c: '#9fd0ff', pill: 'AWAKE', verb: 'rests',
    sent: 'Rests when <span class="w"><i style="color:#ff5fa2">●</i> Eyespot (front)</span> sees <span class="w s">less than 3% sun</span> (dark).',
    q: 'When does it rest?',
    act: (L) => (L < 0.03 ? 'on' : null),
    keys: [['on', 'rests'], ['off', 'awake']] },
  { name: 'Pad (left)', c: '#f5c518', pill: 'FREE', verb: 'holds', always: true,
    sent: 'Holds <i>always</i>. <span style="color:var(--dim);font-size:13px">(joins a kin pad it touches, and its daughter at division)</span>' },
  { name: 'Division', c: '#3fc1c9', pill: '1.1× GROWING', verb: 'divides', always: true,
    sent: 'Divides once it has doubled.' },
];

const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const SINK = [45, 91, 209];
function paint(k) {   // the colour a state is drawn in
  return k === 'sink' ? SINK : null;
}

// the new map: the water underneath, the part's colour laid over it (striped, see-through) where it acts, outlined
function drawNew(cv, card) {
  const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), col = rgb(card.c);
  const state = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const h = (x + 0.5) / W * 24, d = (y + 0.5) / H * TH, L = light(h, d), s = card.act(L);
    state.push(s);
    let v = water(L);
    if (s) {
      const c = paint(s) || col, stripe = ((x + y) % 6) < 3;
      const a = stripe ? 0.78 : 0.5;
      v = v.map((b, i) => b * (1 - a) + c[i] * a);
    }
    const i = (y * W + x) * 4;
    img.data[i] = v[0]; img.data[i + 1] = v[1]; img.data[i + 2] = v[2]; img.data[i + 3] = 255;
  }
  // a bright edge where the state changes, so the shape reads at a glance
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const s = state[y * W + x];
    const edge = (x > 0 && state[y * W + x - 1] !== s) || (y > 0 && state[(y - 1) * W + x] !== s);
    if (edge) { const i = (y * W + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = 240; }
  }
  ctx.putImageData(img, 0, 0);
  let n = { }; for (const s of state) n[s || 'off'] = (n[s || 'off'] || 0) + 1;
  return n;
}

// the old map, as the game draws it today
function drawOld(cv, card) {
  const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), col = rgb(card.c);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const h = (x + 0.5) / W * 24, d = (y + 0.5) / H * TH, night = sun(h) <= 0;
    const s = card.always ? 'on' : card.act(light(h, d));
    let v = night ? [9, 14, 24] : [17, 28, 46];
    if (s === 'sink') v = SINK; else if (s === 'float') v = [205, 238, 255]; else if (s) v = col;
    const i = (y * W + x) * 4;
    img.data[i] = v[0]; img.data[i + 1] = v[1]; img.data[i + 2] = v[2]; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function swatch(card, k) {
  if (k === 'off') return `background:linear-gradient(90deg, rgb(${water(0.6)}), rgb(${water(0)}))`;
  const c = paint(k) || rgb(card.c);
  return `background:repeating-linear-gradient(135deg, rgb(${c}) 0 3px, rgba(${c},.55) 3px 6px)`;
}

function render(view) {
  const box = document.getElementById('cards'); box.innerHTML = '';
  for (const card of CARDS) {
    const el = document.createElement('div'); el.className = 'card'; el.style.setProperty('--c', card.c);
    el.innerHTML = `<div class="hd"><i></i>${card.name}<span class="pill">${card.pill}</span></div><div class="body"><p class="sent">${card.sent}</p></div>`;
    const b = el.querySelector('.body');
    if (view === 'before') {
      const m = document.createElement('div'); m.className = 'old';
      m.innerHTML = `<div class="mh"><span>WHEN IT ${card.verb.toUpperCase()} · time across, depth down</span><span>now ●</span></div>
        <div class="mbox"><canvas width="${W}" height="${H}"></canvas><span class="ml" style="top:2px">surface</span><span class="ml" style="bottom:2px">2 mm</span>
        <span class="mx" style="left:25%">06</span><span class="mx" style="left:50%">12</span><span class="mx" style="left:75%">18</span>
        <i class="dot" style="left:${NOW.h / 24 * 100}%;top:${NOW.d / TH * 100}%;width:9px;height:9px"></i></div>`;
      b.appendChild(m); drawOld(m.querySelector('canvas'), card);
    } else if (card.always) {
      b.insertAdjacentHTML('beforeend', `<div class="always">◷ No map: it ${card.verb === 'holds' ? 'holds' : 'would divide'} at every hour and depth. Add a <b>+ when…</b> or <b>+ unless…</b> to see one.</div>`);
    } else {
      b.insertAdjacentHTML('beforeend', `<div class="q">${card.q} <span style="color:var(--dim);font-weight:400">· one day, surface to floor</span></div>
        <div class="map">
          <div class="xl"><span style="left:0.000%;transform:none">00h</span><span style="left:12.500%">03h</span><span style="left:25.000%">06h</span><span style="left:37.500%">09h</span><span style="left:50.000%">12h</span><span style="left:62.500%">15h</span><span style="left:75.000%">18h</span><span style="left:87.500%">21h</span><span style="left:100.000%;transform:translateX(-100%)">24h</span></div>
          <div class="yl"><span style="top:4%">surface</span><span style="top:50%">1 mm</span><span style="top:94%">floor</span></div>
          <div class="cv"><canvas width="${W}" height="${H}"></canvas><i class="dot" style="left:${NOW.h / 24 * 100}%;top:${NOW.d / TH * 100}%"></i></div>
          <div class="xd"><span style="left:25%">dawn</span><span style="left:50%">noon</span><span style="left:75%">dusk</span></div>
        </div>
        <div class="legend">${card.keys.map(([k, t]) => `<span><i class="sw" style="${swatch(card, k)}"></i>${t}</span>`).join('')}<span><i class="sw" style="background:#fff6b0;border-radius:50%;width:12px"></i>your cell now</span></div>
        <div class="cap"></div>`);
      const n = drawNew(b.querySelector('canvas'), card), tot = W * H, pc = (k) => Math.round((n[k] || 0) / tot * 100);
      b.querySelector('.cap').textContent = card.verb === 'floats' ? `Floats ${pc('float')}% of the time and depths, sinks ${pc('sink')}%.`
        : `${card.keys[0][1][0].toUpperCase() + card.keys[0][1].slice(1)} ${pc('on')}% of the time and depths.`;
    }
    box.appendChild(el);
  }
  document.getElementById('note').innerHTML = view === 'before'
    ? 'Today: a flat block of the part\'s colour on near-black, no legend; night is drawn lighter than day on the rest map; "always" rules fill the whole box.'
    : '<b>What changed:</b> the water is drawn as it is (dark nights, a bright noon fading with depth), so the shape of a day shows by itself; where the part acts is its colour laid over it in stripes, with a bright edge; a legend under each map; hours and depths on the axes; the question as the title; rules that always hold get a line, not a map.';
}
document.querySelectorAll('.switch button').forEach((bt) => bt.onclick = () => {
  document.querySelectorAll('.switch button').forEach((x) => x.classList.toggle('on', x === bt));
  render(bt.dataset.v);
});
render('after');
</script>
</main>
</body>
</html>
