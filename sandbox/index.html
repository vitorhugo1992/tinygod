<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyGod Sandbox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1322">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0b1322; --panel: #111c2e; --line: #23324a; --text: #d8e4ea; --dim: #8197a8; --accent: #6fd3b5; --bad: #ff8a7a;
    --btn: #0d1626; --on: #1d4a44;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display: flex; }
  #view { flex: 1; min-width: 0; position: relative; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }   /* drags move cells, not the page */
  [hidden] { display: none !important; }
  select, button, input, textarea { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  button.on { background: var(--on); border-color: var(--accent); }
  .seg { display: inline-flex; } .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; } .seg button:last-child { border-radius: 0 6px 6px 0; }

  /* over the tank: the toolbar and the numbers */
  #bar { position: absolute; top: 8px; left: 8px; right: 52px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #bar button { background: rgba(13,22,38,.88); }
  #bar button.on { background: rgba(29,74,68,.95); }
  #bar .big { font-size: 15px; padding: 4px 12px; }
  #stats { position: absolute; top: 52px; left: 8px; font: 11.5px/1.45 ui-monospace, Consolas, monospace; white-space: pre;
    background: rgba(8,14,26,.78); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; pointer-events: none; }

  #panel { width: 330px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    padding: 10px 12px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 8px; }
  #panel > * { flex-shrink: 0; }
  h1 { font-size: 14px; margin: 0; letter-spacing: .05em; }
  #phone { font-size: 12px; color: var(--dim); } #phone a { color: var(--accent); }
  h2 { font-size: 11px; margin: 6px 0 0; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  label { color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button:disabled { opacity: .4; cursor: default; } button:disabled:hover { border-color: var(--line); }
  #history { margin-top: 4px; }
  .tip { color: var(--dim); font-size: 12px; margin: 2px 0 4px; }
  .slider { display: grid; grid-template-columns: 52px 1fr 92px; align-items: center; gap: 6px; color: var(--dim); }
  .slider input { width: 100%; padding: 0; }
  .slider span { color: var(--text); font-size: 12px; }
  .cat { color: var(--dim); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips button { padding: 4px 8px; font-size: 12px; }
  #addPart { width: 100%; padding: 8px; font-size: 14px; background: var(--on); border-color: var(--accent); }
  #buildErr, #err { color: var(--bad); }
  .part { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; flex-wrap: wrap; }
  .part button { padding: 1px 7px; font-size: 11px; }
  /* each part a rule drives, and each sensor, has its colour: a stripe on its card, a dot by its name */
  .part.tagged { border-left: 4px solid var(--tag); padding-left: 8px; margin: 6px 0; border-radius: 3px; background: rgba(255,255,255,.02); }
  .part .pnm { display: flex; align-items: center; gap: 6px; cursor: pointer; min-width: 0; }
  .part .pnm .nm { font-weight: 600; }
  .part .pnm .fold { color: var(--dim); width: 10px; }
  .part .pnm .ren { padding: 0 5px; border: none; background: none; color: var(--dim); }
  .part .psum { width: 100%; color: var(--dim); font-size: 12px; line-height: 1.45; padding: 2px 0 6px; cursor: pointer; }
  .part .psum b { color: var(--text); font-weight: 500; }
  .part.flash { box-shadow: 0 0 0 2px var(--tag, var(--accent)); transition: box-shadow .3s; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: middle; flex: none; }
  .rtools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; width: 100%; }
  .rlabel .mean { color: var(--dim); font-weight: 400; }
  .part.editing { outline: 1px solid var(--accent); border-radius: 4px; padding: 2px 4px; background: rgba(111,211,181,.06); }
  .part .wire { font-size: 11px; display: flex; gap: 4px; align-items: center; width: 100%; flex-wrap: wrap; }
  .part .wire select { font-size: 11px; padding: 2px 4px; flex: 1 1 100%; }
  .part .wire .range { width: 100%; }
  .part .wire .cond { width: 100%; border-left: 2px solid var(--line); padding-left: 6px; margin-top: 4px; }
  .part .wire .condhead { display: flex; gap: 4px; align-items: center; }
  .part .wire .condhead select { flex: 1; }
  .part .wire .addcond { margin-top: 4px; }
  .part .wire .orline { width: 100%; text-align: center; color: var(--accent); font-weight: 600; margin-top: 4px; }
  .part .wire .notbtn { min-width: 58px; }
  .dual .track.out { background: var(--accent); }
  .dual .track.out .band { background: #2a3a52; }
  .part .wire .rlabel b { color: var(--text); font-weight: 600; }
  .part .wire .rscale { color: var(--dim); }
  /* the rule card: GO groups, the STOP override (red), each condition green while it holds */
  .rcard .rhead { width: 100%; margin-top: 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--accent); }
  .rcard .rhead.stop { color: var(--bad); }
  .rcard .rhead.dim { color: var(--dim); font-weight: 400; letter-spacing: 0; }
  .part .wire .cond.stopcond { border-left-color: rgba(255,138,122,.5); }
  .part .wire .cond.holds, #patchEdit .cond.holds { border-left-color: var(--accent); background: rgba(111,211,181,.07); }
  .part .wire .cond.stopping, #patchEdit .cond.stopping { border-left-color: var(--bad); background: rgba(255,138,122,.1); }
  #patchEdit .cond { width: 100%; border-left: 2px solid var(--line); padding-left: 6px; margin-top: 4px; }
  #patchEdit .condhead { display: flex; gap: 4px; align-items: center; }
  #patchEdit .condhead select { flex: 1; }
  #patchEdit { max-height: 45%; overflow: auto; }
  .howsel { flex: 0 0 auto !important; max-width: 40%; }
  .pmod.box.stopbox { border-color: rgba(255,138,122,.5); color: #ffb4a8; }
  .pmod.box.stopbox.lit { border-color: var(--bad); background: rgba(255,138,122,.12); color: var(--text); }
  #patchWires path.stopc { stroke: #6a3b44; }
  #patchWires path.stopc.lit { stroke: var(--bad); }
  .pchip.stopchip { border-color: #6a3b44; }
  .pchip.stopchip.lit { border-color: var(--bad); }
  .rends { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin: -2px 9px 0; }
  /* two handles on one bar; the track is inset by half a thumb so 0 and 1 sit under the thumbs' centres */
  .dual { position: relative; height: 26px; }
  .dual .track { position: absolute; left: 9px; right: 9px; top: 11px; height: 4px; background: #2a3a52; border-radius: 2px; }
  .dual .band { position: absolute; top: 0; height: 4px; background: var(--accent); border-radius: 2px; }
  .dual .most { position: absolute; top: -3px; width: 2px; height: 10px; margin-left: -1px; background: rgba(255,240,190,.55); }
  .dual .now { position: absolute; top: -6px; width: 3px; height: 16px; margin-left: -1px; background: #ff8a3c; border-radius: 1px; }
  .dual input { position: absolute; left: 0; top: 2px; width: 100%; height: 22px; margin: 0; padding: 0; border: 0;
    background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
  .dual input::-webkit-slider-runnable-track { background: none; }
  .dual input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: #d8e4ea; border: 2px solid var(--accent); cursor: pointer; }
  .dual input::-moz-range-track { background: none; }
  .dual input::-moz-range-thumb { pointer-events: auto; width: 14px; height: 14px; border-radius: 50%; background: #d8e4ea;
    border: 2px solid var(--accent); cursor: pointer; }
  #partList .cat { margin-top: 4px; }
  details summary { color: var(--dim); cursor: pointer; }
  textarea { width: 100%; height: 220px; font: 11px/1.35 ui-monospace, Consolas, monospace; resize: vertical; margin-top: 6px; }
  /* the patch view (over the tank on a computer, over the panel on a phone, so the cell stays in sight) */
  #patchBtn, #arrangeBtn, #squishBtn { width: 100%; margin: 4px 0; }
  /* arranging: sliders over the tank (Y left, Zoom right: vertical, up = more; X along the bottom) */
  #arrangeView { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  #arrangeView[hidden] { display: none; }
  #arrangeView input { position: absolute; pointer-events: auto; accent-color: #5fd0ff; }
  #arrangeView .vrange { writing-mode: vertical-lr; direction: rtl; width: 28px; top: 70px; bottom: 70px; height: auto; }
  #arrPanY { left: 6px; }
  #arrZoom { right: 6px; }
  #arrPanX { left: 44px; right: 44px; bottom: 40px; width: auto; }
  #arrButtons { position: absolute; left: 44px; right: 44px; top: 46px; display: flex; gap: 8px; justify-content: center; pointer-events: none; }
  #arrButtons button { pointer-events: auto; padding: 8px 12px; background: rgba(8,14,26,.85); }
  #patch { position: fixed; left: 0; right: 330px; top: 52vh; bottom: 0; background: var(--bg); z-index: 20;
    display: flex; flex-direction: column; border-right: 1px solid var(--line); border-top: 1px solid var(--line); }
  #patch[hidden] { display: none; }
  #patchHead { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  #patchHint { flex: 1; color: var(--dim); font-size: 12px; }
  #patchBody { flex: 1; overflow: auto; }
  #patchArea { position: relative; min-height: 100%; }
  #patchWires { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #patchWires path { fill: none; stroke: #3b4f6c; stroke-width: 2.5; }
  #patchWires path.lit { stroke: var(--accent); }
  #patchWires path[data-key^="v"] { stroke-dasharray: 5 4; }   /* a compare's second sensor */
  /* the nucleus opened up: a box round its modules, its free slots dashed, unwired built-in readings in a tray above */
  #patchWires rect.nucbox { fill: rgba(176,150,214,.07); stroke: #8f7cb8; stroke-width: 1.5; }
  #patchWires text.nuclab { fill: #c9b6ea; font: 600 11px system-ui; letter-spacing: .04em; }
  #patchTray { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px 0; }
  #patchTray:empty { display: none; }
  .pmod.spare { padding: 3px 7px; border-style: dashed; cursor: pointer; }
  .pfree { border: 1px dashed #4a4266; border-radius: 7px; padding: 5px 7px; font-size: 11px; color: #6f6690; text-align: center; }
  .pfree.full { border-color: var(--bad); color: var(--bad); }
  .nonuc { padding: 14px; line-height: 1.5; }
  #patchCols { position: relative; display: flex; gap: 18%; padding: 32px 10px 10px; align-items: flex-start; }
  .pcol { display: flex; flex-direction: column; gap: 8px; }
  .pcol.src { width: 34%; }
  .prules { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .prow { display: flex; align-items: center; gap: 14%; }
  .pboxes { width: 28%; display: flex; flex-direction: column; gap: 6px; }
  .pmod { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px;
    font-size: 11px; line-height: 1.25; cursor: pointer; user-select: none; }
  .pmod .pname { font-weight: 600; font-size: 12px; }
  .pmod .pval { color: var(--dim); }
  .pmod .pbar { height: 3px; background: #2a3a52; border-radius: 2px; margin-top: 3px; position: relative; }
  .pmod .pbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #ff8a3c; border-radius: 2px; }
  .pmod.picked, .pjack.picked { border-color: #ff8a3c; box-shadow: 0 0 0 2px rgba(255,138,60,.35); }
  .pjack { border: 1px solid transparent; border-radius: 5px; margin: -2px -4px; padding: 2px 4px; }
  .pjack + .pjack { margin-top: 4px; border-top: 1px dashed var(--line); border-radius: 0 0 5px 5px; }
  .pmod.box { text-align: center; color: var(--dim); }
  .pmod.box.lit, .pmod.tgt.lit { border-color: var(--accent); color: var(--text); background: rgba(111,211,181,.08); }
  .pmod.box.add { border-style: dashed; background: none; }
  .pmod.tgt { flex: 1; }
  .pmod .pstate { float: right; font-size: 10px; padding: 0 4px; border-radius: 3px; background: #2a3a52; }
  .pmod.tgt.lit .pstate { background: var(--accent); color: #062018; }
  .pchip { position: absolute; transform: translate(-50%, -50%); font-size: 10px; padding: 1px 5px; border-radius: 8px;
    background: #1a2740; border: 1px solid #3b4f6c; cursor: pointer; white-space: nowrap; z-index: 2; }
  .pchip.lit { border-color: var(--accent); }
  .pchip.on { border-color: #ff8a3c; }
  #patchEdit { border-top: 1px solid var(--line); padding: 8px 10px; background: var(--panel); font-size: 12px; }
  #patchEdit .row { margin-top: 4px; }
  @media (max-width: 760px) {
    #patch { right: 0; top: 46vh; top: 46dvh; border-right: 0; border-top: 1px solid var(--line); }
    /* the tank stays pinned on top; only the panel below it scrolls, so the cell is always in sight */
    body { flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
    #view { height: 46vh; height: 46dvh; flex: none; }
    #panel { width: 100%; flex: 1; min-height: 0; border-left: 0; border-top: 1px solid var(--line); }
    /* one compact toolbar row that scrolls sideways, so the tank stays visible */
    #bar { flex-wrap: nowrap; overflow-x: auto; right: 44px; gap: 4px; scrollbar-width: none; }
    #bar::-webkit-scrollbar { display: none; }
    #bar > * { flex: none; }
    #bar button { padding: 3px 7px; font-size: 12px; }
    #bar .big { font-size: 13px; padding: 3px 9px; }
    #stats { font-size: 10px; }
    /* sliders only answer a finger on their thumb row, so scrolling the panel doesn't move them */
    input[type=range] { touch-action: pan-y; }
  }
</style>
</head>
<body>
<div id="view">
  <canvas id="c"></canvas>
  <div id="arrangeView" hidden>   <!-- arranging: Y on the left, Zoom on the right, X along the bottom -->
    <input type="range" id="arrPanY" class="vrange" min="-100" max="100" step="1" value="0" title="Look up or down">
    <input type="range" id="arrZoom" class="vrange" min="1" max="4" step="0.1" value="1" title="Zoom in, for fine work">
    <input type="range" id="arrPanX" min="-100" max="100" step="1" value="0" title="Look left or right">
    <div id="arrButtons">
      <button id="arrUndo" title="Undo the last change">↶ Undo</button>
      <button id="arrRedo" title="Redo">↷ Redo</button>
      <button id="arrFit" disabled title="Fit: organelles on top of each other or sticking out of the wall are pushed apart, then squish against each other and the wall (each keeps its volume)">🫧 Fit</button>
      <button id="arrDeselect" disabled title="Let go of the selected organelle (then another can be picked)">✕ Deselect</button>
    </div>
  </div>
  <div id="bar">
    <button id="play" class="big" title="Play / pause">▶</button>
    <button id="infoBtn" title="Show or hide the numbers">ⓘ</button>
    <button id="step" title="Step 10 ms">Step</button>
    <button id="reset" title="Start again (re-cocks springs)">↺ Reset</button>
    <button id="release" title="Fire the springs (a charged spring beats hard for a moment and throws the cell)">⚡ Release</button>
    <span class="seg" id="speedSeg" title="Speed"></span>
    <span class="seg" id="viewSeg" title="Camera"></span>
    <button id="gravityBtn" title="Weight and buoyancy">Gravity</button>
    <button id="lightBtn" title="Light from above, fading with depth">☀ Light</button>
    <button id="calmBtn" title="Draw beating parts slowly so they are pleasant to watch (the physics is unchanged); off: the true beat">〰 Calm</button>
    <button id="dayBtn" title="The sun rises and sets (a day lasts 10 minutes at 1×); off: always noon">☾ Day</button>
    <button id="graphBtn" class="on" title="The day graph: depth, energy, stores and float over the last day, and what went wrong">📈 Graph</button>
    <button id="forcesBtn" title="Arrows: weight minus buoyancy, the way it moves, and which way gravity turns it">↗ Forces</button>
    <span class="seg"><button id="rotL" title="Turn the selected cell (or Q)">⟲</button><button id="rotR" title="Turn the selected cell (or E)">⟳</button></span>
    <span class="seg"><button id="zoomOut" title="Zoom out (or mouse wheel)">−</button><button id="zoomIn" title="Zoom in (or mouse wheel)">+</button></span>
  </div>
  <div id="stats"></div>
</div>
<div id="panel">
  <h1>TINYGOD · SANDBOX</h1>
  <div id="phone" hidden title="Open this on a phone on the same Wi-Fi; on the phone, ⋮ → Add to Home screen pins it"></div>
  <div class="row" id="history">
    <button id="undo" title="Undo the last change to the design">↶ Undo</button>
    <button id="redo" title="Redo what was undone">↷ Redo</button>
    <button id="clearParts" title="Remove every part, keep the body (Undo brings them back)">🗑 Delete all</button>
    <button id="saveDesign" title="Save this design in this browser (it survives a reload)">💾 Save</button>
    <select id="savedWhat" title="Load a saved design in place of the selected cell (the tank goes on)"></select>
    <button id="deleteSaved" title="Delete the chosen saved design">✕</button>
    <button id="getDesigns" title="Get the designs Claude left for you: they go into your saved designs">📥 From Claude</button>
    <button id="sendDesign" title="Send this design to Claude: the computer running the sandbox saves it in the project (designs/)">📤 Send to Claude</button>
    <button id="copyDesign" title="Copy this design as text, to paste on another device (e.g. message it to yourself)">📋 Copy</button>
    <button id="pasteDesign" title="Paste a copied design: it goes into your saved designs and the tank">📋 Paste</button>
    <button id="testDay" title="Run this design a whole day ahead, from where it is now, and show the forecast in the graph">⏩ Test a day</button>
  </div>

  <h2>Body</h2>
  <div class="slider">Radius <input type="range" id="bodyRadius" min="1" max="50" step="0.5"><span id="bodyRadiusOut"></span></div>
  <div class="slider" title="0 = round; longer makes a rod">Length <input type="range" id="bodyLength" min="0" max="200" step="1"><span id="bodyLengthOut"></span></div>
  <div class="row">Wall <span class="seg" id="wallSeg"></span></div>

  <h2>Add a part</h2>
  <div id="chips"></div>
  <div class="slider" title="Where on the body: 0° front (right), 180° back">Where <input type="range" id="partAngle" min="0" max="355" step="5" value="180"><span id="partAngleOut"></span></div>
  <div class="slider" id="tiltRow" title="Turn the part away from pointing straight out (a side flagellum needs tilt to turn the cell)"><span id="tiltLabel">Tilt</span> <input type="range" id="partTilt" min="-90" max="90" step="5" value="0"><span id="partTiltOut"></span></div>
  <div class="slider" id="lengthRow" title="How long the part is: longer pushes harder, but drags more and costs more upkeep">Length <input type="range" id="partLength" min="10" max="100" step="5" value="40"><span id="partLengthOut"></span></div>
  <div class="row" id="flipRow"><button id="flipBtn" title="Mirror the part about its own line: it beats the other way (a spring's jump curves to the other side)">⇅ Flip</button>
    <button id="pullBtn" title="Pull: the wave runs from the tip toward the body, so the tail pulls the cell after it instead of pushing">⇠ Pull</button></div>
  <div class="slider" id="insideRow" title="0 = centre, 100 = against the wall; droplets and vacuoles can't overlap">Inside <input type="range" id="partInside" min="0" max="100" step="5" value="100"><span id="partInsideOut"></span></div>
  <div class="row" id="feelsRow" title="What a touch or proximity sensor reacts to">Feels <span class="seg" id="feelsSeg"></span></div>
  <div class="slider" id="sizeRow"><span id="sizeLabel">Size</span> <input type="range" id="partSize" min="10" max="100" step="5" value="40"><span id="partSizeOut"></span></div>
  <div class="row" id="pigmentRow" title="What the plastid catches light with">Pigment <span class="seg" id="pigmentSeg"></span></div>
  <div class="row" id="materialRow" title="What the spine is made of: protein is light and cheap, glass heavy and stiff">Material <span class="seg" id="materialSeg"></span></div>
  <div class="row" id="sticksRow" title="A kin pad holds only its own species, strongly; a mucus pad holds anything, weakly">Sticks to <span class="seg" id="sticksSeg"></span></div>
  <div class="row" id="contentRow" title="What the vacuole holds decides what it does">Content <span class="seg" id="contentSeg"></span></div>
  <div id="contentTip" class="tip"></div>
  <button id="addPart">＋ Add to body</button>
  <button id="cancelEdit" hidden>Stop editing</button>
  <div id="buildErr"></div>

  <h2>On this body</h2>
  <button id="arrangeBtn" title="Hold the cell still and large: slide to look around; tap an organelle to select it, then drag it, pinch anywhere to resize it; drag the wall to resize the cell">✋ Arrange inside the cell</button>
  <button id="squishBtn" hidden title="Make the overlapping organelles give way: they flatten against each other and the wall">🫧 Squish to fit</button>
  <div id="arrangeTools" hidden>
    <div class="slider" title="Turn the selected organelle (a statolith: the way it reads)">Turn <input type="range" id="arrTurn" min="-180" max="180" step="5" value="0"><span id="arrTurnOut"></span></div>
  </div>
  <button id="patchBtn" title="Open the nucleus, the cell's brain: patch sensors to parts with cables (or tap the nucleus in the tank)">🧬 Open the nucleus (wiring)</button>
  <div id="partList"></div>

  <h2>Tank</h2>
  <div class="row">
    <select id="addWhat" title="What to add"></select>
    <button id="add" title="Add a cell beside the selected one">＋ Cell</button>
  </div>

  <details>
    <summary>Advanced: design as JSON</summary>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="row"><button id="apply">Apply</button><span id="err"></span></div>
  </details>

  <!-- state the code reads; the buttons above drive them -->
  <select id="partWhat" hidden></select>
  <select id="speed" hidden><option value="0.1">0.1×</option><option value="1" selected>1×</option><option value="5">5×</option><option value="20">20×</option></select>
  <select id="viewMode" hidden><option value="follow" selected>Follow</option><option value="fit">Fit</option><option value="free">Free</option></select>
  <select id="partFeels" hidden><option value="strangers" selected>Other species</option><option value="anything">Anything (cells, walls)</option></select>
  <select id="bodyWall" hidden><option value="protein">Protein</option><option value="glass">Glass</option></select>
  <input type="checkbox" id="partFlip" hidden>
  <input type="checkbox" id="partPull" hidden>
  <select id="partPigment" hidden><option value="sun">Chl a</option><option value="shade">Phycobilins</option></select>
  <select id="partMaterial" hidden><option value="protein">Protein</option><option value="glass">Glass</option></select>
  <select id="partSticks" hidden><option value="kin">Its own kind</option><option value="mucus">Anything</option></select>
  <select id="partContent" hidden><option value="starch">Starch</option><option value="oil">Oil</option></select>
  <input type="checkbox" id="gravity" checked hidden>
  <input type="checkbox" id="light" checked hidden>
  <input type="checkbox" id="day" checked hidden>
  <input type="range" id="zoom" min="0.3" max="20" step="any" value="5" hidden>
</div>
<!-- the patch view: sensors on the left, rules (AND boxes) in the middle, parts on the right; tap, tap to patch -->
<div id="patch" hidden>
  <div id="patchHead"><b>🧬 Nucleus</b><span id="patchHint"></span><button id="patchClose" title="Close the wiring view">✕</button></div>
  <div id="patchBody"><div id="patchArea"><svg id="patchWires"></svg><div id="patchTray"></div><div id="patchCols"></div></div></div>
  <div id="patchEdit" hidden></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
